services:
  backend:
    container_name: furniture-backend
    build:
      context: ./Backend
      dockerfile: Dockerfile
    env_file:
      - ./Backend/.env
    ports:
      - '4000:3000'
    restart: unless-stopped

  frontend:
    container_name: furniture-frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    env_file:
      - ./Frontend/.env
    environment:
      - INTERNAL_API_URL=http://backend:3000
    ports:
      - '3000:3000'
    depends_on:
      - backend
    restart: unless-stopped
